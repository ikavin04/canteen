<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Smart Canteen | KGiSL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 2.18l7 3.82v8c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V8l7-3.82z"/>
                    <path d="M8 10h3v8H8zm5 0h3v8h-3z" fill="#FF5E36"/>
                </svg>
                <span>Smart<br>Canteen</span>
            </a>
            <div class="nav-menu">
                <a href="index.html" class="btn btn-outline btn-small">Home</a>
                <a href="login.html" class="btn btn-primary btn-small">Login</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="auth-container">
            <div class="auth-card" style="max-width: 520px;">
                <h2>Create Your Account</h2>
                <p class="auth-subtitle">Join the KGiSL Smart Canteen community</p>
                <div id="message" class="message hidden"></div>

                <form id="registerForm" class="auth-form" novalidate>
                    <!-- User Type Selector Pills -->
                    <div class="form-group">
                        <label>I am a</label>
                        <div class="user-type-selector">
                            <div class="user-type-pill active" onclick="selectUserType('Student', this)" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                                <span>Student</span>
                            </div>
                            <div class="user-type-pill" onclick="selectUserType('Staff', this)" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                                <span>Staff</span>
                            </div>
                            <div class="user-type-pill" onclick="selectUserType('Guest', this)" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                <span>Guest</span>
                            </div>
                        </div>
                        <input type="hidden" id="userType" name="userType" value="Student">
                        <span class="error-text" id="userTypeError"></span>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="e.g. kavin_cse or john_doe" required autocomplete="username">
                        <span class="error-text" id="usernameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Campus or Personal Email</label>
                        <input type="email" id="email" name="email" placeholder="e.g. student@kgisl.edu or name@gmail.com" required autocomplete="email">
                        <span class="error-text" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Min. 8 chars (1 uppercase, 1 special)" required autocomplete="new-password">
                            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <span class="error-text" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-password-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required autocomplete="new-password">
                            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('confirmPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <span class="error-text" id="confirmPasswordError"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 10px;">
                        Complete Registration &rarr;
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px; font-size: 0.92rem; color: var(--text-secondary);">
                    Already have an account? <a href="login.html" style="font-weight: 700;">Sign in here</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Smart Canteen &bull; KGiSL Institute of Technology</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        function selectUserType(type, pillEl) {
            document.querySelectorAll('.user-type-pill').forEach(p => p.classList.remove('active'));
            pillEl.classList.add('active');
            document.getElementById('userType').value = type;
        }

        function togglePasswordVisibility(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                field.type = 'password';
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Reset errors
            ['usernameError', 'emailError', 'userTypeError', 'passwordError', 'confirmPasswordError'].forEach(id => {
                document.getElementById(id).textContent = '';
            });

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const userType = document.getElementById('userType').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            let hasError = false;

            if (!username || username.length < 3) {
                document.getElementById('usernameError').textContent = 'Username must be at least 3 characters long';
                hasError = true;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                hasError = true;
            }

            if (!userType) {
                document.getElementById('userTypeError').textContent = 'Please select your role (Student/Staff/Guest)';
                hasError = true;
            }

            if (!password || password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters long';
                hasError = true;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                hasError = true;
            }

            if (hasError) return;

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Creating account...';
            submitBtn.disabled = true;

            try {
                const result = await registerUser(username, email, password, userType);
                if (result.success) {
                    showMessage('Registration successful! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } else {
                    showMessage(result.message || 'Registration failed. Username or email may already be registered.', 'error');
                    submitBtn.textContent = 'Complete Registration →';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showMessage('Network error. Please try again.', 'error');
                submitBtn.textContent = 'Complete Registration →';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
