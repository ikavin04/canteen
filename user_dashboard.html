<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Menu - Smart Canteen | KGiSL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 2.18l7 3.82v8c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V8l7-3.82z"/>
                    <path d="M8 10h3v8H8zm5 0h3v8h-3z" fill="#FF5E36"/>
                </svg>
                <span>Smart<br>Canteen</span>
            </a>

            <!-- Search Button -->
            <button class="search-icon-btn" onclick="toggleSearch()" title="Search food items" id="searchToggleBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>

            <!-- Search Dropdown Box -->
            <div class="search-container" id="searchContainer" style="display: none;">
                <input type="text" id="searchInput" class="search-input" placeholder="Search delicacies (e.g. Burger, Tea, Pasta)..." oninput="performSearch(this.value)">
                <div id="searchResults" class="search-results"></div>
            </div>

            <div class="nav-menu">
                <button class="hamburger" id="hamburgerBtn" aria-controls="navLinks" aria-expanded="false" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <div class="nav-links" id="navLinks">
                    <a href="user_orders.html" style="display: inline-flex; align-items: center; gap: 6px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <span>My Orders</span>
                    </a>
                    
                    <!-- Cart Trigger Pill -->
                    <div class="cart-icon" onclick="toggleCart()" id="navCartBtn" style="display: inline-flex; align-items: center; gap: 8px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span>Cart (<span id="cartCount">0</span>)</span>
                    </div>

                    <!-- User Profile & Logout -->
                    <div class="user-info">
                        <span id="userName">User</span>
                        <button onclick="logout()" class="btn btn-outline btn-small">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div id="notification" class="notification hidden"></div>

        <!-- Categories Section -->
        <div class="dashboard-header">
            <h2>Browse by Category</h2>
        </div>

        <div class="category-browse">
            <div class="category-item active" onclick="filterByCategory('All', this)">
                <div class="category-circle">
                    <img src="all categories.png" alt="All Categories" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=120&auto=format&fit=crop'">
                </div>
                <span>All Items</span>
            </div>
            <div class="category-item" onclick="filterByCategory('Main Course', this)">
                <div class="category-circle">
                    <img src="Main Course.png" alt="Main Course" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=120&auto=format&fit=crop'">
                </div>
                <span>Main Course</span>
            </div>
            <div class="category-item" onclick="filterByCategory('Snacks', this)">
                <div class="category-circle">
                    <img src="Snacks.png" alt="Snacks" onerror="this.src='https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=120&auto=format&fit=crop'">
                </div>
                <span>Snacks</span>
            </div>
            <div class="category-item" onclick="filterByCategory('Beverages', this)">
                <div class="category-circle">
                    <img src="Beverages.png" alt="Beverages" onerror="this.src='https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=120&auto=format&fit=crop'">
                </div>
                <span>Beverages</span>
            </div>
            <div class="category-item" onclick="filterByCategory('Breakfast', this)">
                <div class="category-circle">
                    <img src="Breakfast.png" alt="Breakfast" onerror="this.src='https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=120&auto=format&fit=crop'">
                </div>
                <span>Breakfast</span>
            </div>
            <div class="category-item" onclick="filterByCategory('Desserts', this)">
                <div class="category-circle">
                    <img src="Deseserts.png" alt="Desserts" onerror="this.src='https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=120&auto=format&fit=crop'">
                </div>
                <span>Desserts</span>
            </div>
        </div>

        <!-- Menu Section -->
        <div class="menu-section-header">
            <h2 id="menuSectionTitle">Today's Fresh Menu</h2>
            <span id="menuCountBadge" style="font-weight: 700; color: var(--text-muted); font-size: 0.95rem;"></span>
        </div>

        <div class="menu-grid" id="menuGrid">
            <!-- Rendered dynamically -->
        </div>
    </main>

    <!-- Slide-out Cart Drawer -->
    <div class="cart-panel-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h3 style="display: flex; align-items: center; gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span>Your Order</span>
            </h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Rendered dynamically -->
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Subtotal:</span>
                <span class="cart-total-amount">₹<span id="cartTotal">0.00</span></span>
            </div>
            <button id="checkoutBtn" onclick="proceedToPayment()" class="btn btn-primary btn-large" style="width: 100%;">
                Proceed to Checkout &rarr;
            </button>
        </div>
    </div>

    <!-- Quantity Selection Modal -->
    <div class="modal-overlay" id="quantityModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalItemName">Select Quantity</h3>
                <button class="close-cart" onclick="closeQuantityModal()">&times;</button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <img id="modalItemImage" src="" alt="Food" style="width: 120px; height: 120px; border-radius: 16px; object-fit: cover; margin: 0 auto 16px;">
                <p id="modalItemPrice" style="font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 20px;"></p>

                <div style="display: inline-flex; align-items: center; gap: 16px; background: var(--bg-main); padding: 8px 18px; border-radius: var(--radius-full); border: 1.5px solid var(--border-color);">
                    <button class="quantity-btn" onclick="adjustModalQuantity(-1)" style="width: 36px; height: 36px; font-size: 1.2rem;">-</button>
                    <span id="modalQuantity" style="font-size: 1.3rem; font-weight: 800; min-width: 30px;">1</span>
                    <button class="quantity-btn" onclick="adjustModalQuantity(1)" style="width: 36px; height: 36px; font-size: 1.2rem;">+</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeQuantityModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmAddToCart()">Add to Order</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Smart Canteen &bull; KGiSL Institute of Technology</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        let allMenuItems = [];
        let selectedCategory = 'All';
        let currentModalItem = null;
        let currentModalQty = 1;

        // Ensure user is logged in
        const currentUser = getCurrentUser();
        if (!currentUser) {
            window.location.href = 'login.html';
        } else if (currentUser.role === 'admin') {
            window.location.href = 'admin.html';
        }

        document.addEventListener('DOMContentLoaded', async function() {
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.username;
            }
            initializeMobileNav();
            updateCartBadge();
            await loadMenu();
        });

        async function loadMenu() {
            try {
                allMenuItems = await getMenu();
                renderMenu();
            } catch (err) {
                console.error('Error loading menu:', err);
                document.getElementById('menuGrid').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                        <p style="color: var(--text-muted); font-size: 1.1rem;">Unable to load menu. Please try refreshing.</p>
                    </div>
                `;
            }
        }

        function filterByCategory(category, el) {
            selectedCategory = category;
            if (el) {
                document.querySelectorAll('.category-item').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            document.getElementById('menuSectionTitle').textContent = category === 'All' ? "Today's Fresh Menu" : `${category} Specials`;
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const items = selectedCategory === 'All' 
                ? allMenuItems 
                : allMenuItems.filter(item => item.category.toLowerCase() === selectedCategory.toLowerCase());

            document.getElementById('menuCountBadge').textContent = `${items.length} items available`;

            if (items.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 1px dashed var(--border-color);">
                        <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: #FFF5F2; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
                        </div>
                        <h3 style="color: var(--secondary); margin-bottom: 6px;">No items found in this category</h3>
                        <p style="color: var(--text-muted);">Please check back later or browse other categories!</p>
                    </div>
                `;
                return;
            }

            const fallbackImages = {
                'Main Course': 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&auto=format&fit=crop',
                'Snacks': 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=400&auto=format&fit=crop',
                'Beverages': 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400&auto=format&fit=crop',
                'Breakfast': 'https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=400&auto=format&fit=crop',
                'Desserts': 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=400&auto=format&fit=crop'
            };

            grid.innerHTML = items.map(item => {
                const imgUrl = item.image_url || fallbackImages[item.category] || fallbackImages['Main Course'];
                const isAvailable = item.availability !== false;

                return `
                    <div class="menu-item-card">
                        <div class="menu-item-image-wrapper">
                            <img src="${imgUrl}" alt="${item.item_name}" class="menu-item-image" onerror="this.src='${fallbackImages['Main Course']}'">
                            <span class="menu-item-category-tag">${item.category}</span>
                            <span class="menu-item-badge ${isAvailable ? 'available' : 'unavailable'}">
                                ${isAvailable ? '● Available' : '○ Sold Out'}
                            </span>
                        </div>
                        <div class="menu-item-body">
                            <h3 class="menu-item-title">${item.item_name}</h3>
                            <p class="menu-item-desc">${item.description || 'Prepared fresh daily in the campus kitchen with premium ingredients.'}</p>
                            <div class="menu-item-footer">
                                <span class="menu-item-price">₹${parseFloat(item.price).toFixed(2)}</span>
                                <button class="btn btn-primary btn-small" 
                                    ${!isAvailable ? 'disabled' : ''} 
                                    onclick="openQuantityModal(${item.id})">
                                    + Add
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Search Handlers
        function toggleSearch() {
            const container = document.getElementById('searchContainer');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                document.getElementById('searchInput').focus();
            } else {
                container.style.display = 'none';
            }
        }

        function performSearch(query) {
            const resultsContainer = document.getElementById('searchResults');
            const q = query.trim().toLowerCase();
            if (!q) {
                resultsContainer.innerHTML = '';
                return;
            }

            const matches = allMenuItems.filter(item => 
                item.item_name.toLowerCase().includes(q) || 
                item.category.toLowerCase().includes(q)
            );

            if (matches.length === 0) {
                resultsContainer.innerHTML = `<div style="padding: 16px; text-align: center; color: var(--text-muted);">No dishes match "${query}"</div>`;
                return;
            }

            resultsContainer.innerHTML = matches.map(item => `
                <div class="search-result-item" onclick="openQuantityModal(${item.id}); toggleSearch();">
                    <img src="${item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100'}" class="search-item-image" alt="${item.item_name}">
                    <div class="search-item-content">
                        <div class="search-item-name">${item.item_name}</div>
                        <div class="search-item-category">${item.category}</div>
                    </div>
                    <div class="search-item-price">₹${parseFloat(item.price).toFixed(2)}</div>
                </div>
            `).join('');
        }

        // Cart Drawer Handlers
        function toggleCart() {
            const panel = document.getElementById('cartPanel');
            const overlay = document.getElementById('cartOverlay');
            panel.classList.toggle('active');
            overlay.classList.toggle('active');
            if (panel.classList.contains('active')) {
                renderCartDrawer();
            }
        }

        function updateCartBadge() {
            const cart = getCart();
            const totalQty = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            document.getElementById('cartCount').textContent = totalQty;
        }

        function renderCartDrawer() {
            const cart = getCart();
            const cartItemsEl = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (cart.length === 0) {
                cartItemsEl.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
                        <div style="width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; background: var(--bg-main); display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        </div>
                        <h4 style="color: var(--secondary); margin-bottom: 6px;">Your Cart is Empty</h4>
                        <p style="font-size: 0.9rem;">Add some mouth-watering items from the menu to start!</p>
                    </div>
                `;
                totalEl.textContent = '0.00';
                checkoutBtn.disabled = true;
                return;
            }

            checkoutBtn.disabled = false;
            let total = 0;

            cartItemsEl.innerHTML = cart.map(item => {
                const itemTotal = parseFloat(item.price) * item.quantity;
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">₹${parseFloat(item.price).toFixed(2)} each</div>
                        </div>
                        <div class="cart-item-controls">
                            <button class="quantity-btn" onclick="changeCartQty(${item.id}, -1)">-</button>
                            <span class="cart-item-quantity">${item.quantity}</span>
                            <button class="quantity-btn" onclick="changeCartQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.textContent = total.toFixed(2);
            updateCartBadge();
        }

        function changeCartQty(id, delta) {
            updateItemQuantity(id, delta);
            renderCartDrawer();
        }

        function proceedToPayment() {
            const cart = getCart();
            if (cart.length === 0) {
                showMessage('Please add items to your cart before proceeding', 'error');
                return;
            }
            window.location.href = 'payment.html';
        }

        // Modal Handlers
        function openQuantityModal(itemId) {
            const item = allMenuItems.find(i => i.id === itemId);
            if (!item) return;
            currentModalItem = item;
            currentModalQty = 1;

            document.getElementById('modalItemName').textContent = item.item_name;
            document.getElementById('modalItemImage').src = item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200';
            document.getElementById('modalItemPrice').textContent = `₹${parseFloat(item.price).toFixed(2)}`;
            document.getElementById('modalQuantity').textContent = currentModalQty;

            document.getElementById('quantityModal').classList.add('active');
        }

        function closeQuantityModal() {
            document.getElementById('quantityModal').classList.remove('active');
            currentModalItem = null;
        }

        function adjustModalQuantity(delta) {
            currentModalQty = Math.max(1, Math.min(10, currentModalQty + delta));
            document.getElementById('modalQuantity').textContent = currentModalQty;
        }

        function confirmAddToCart() {
            if (!currentModalItem) return;
            addToCart(currentModalItem, currentModalQty);
            updateCartBadge();
            closeQuantityModal();
            showMessage(`Added ${currentModalQty}x ${currentModalItem.item_name} to cart!`, 'success');
        }
    </script>
</body>
</html>
