<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Canteen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 2.18l7 3.82v8c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V8l7-3.82z"/>
                    <path d="M8 10h3v8H8zm5 0h3v8h-3z" fill="#FF5E36"/>
                </svg>
                <span>Smart<br>Canteen</span>
            </a>
            <div class="nav-menu">
                <a href="index.html" class="btn btn-outline btn-small">Home</a>
                <a href="register.html" class="btn btn-primary btn-small">Register</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="auth-container">
            <div class="auth-card">
                <h2>Welcome Back!</h2>
                <p class="auth-subtitle">Sign in to order food and track your meals</p>
                <div id="message" class="message hidden"></div>

                <form id="loginForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="username">Username or ID</label>
                        <input type="text" id="username" name="username" placeholder="e.g. john_doe or admin" required autocomplete="username">
                        <span class="error-text" id="usernameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <span class="error-text" id="passwordError"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 10px;">
                        Sign In &rarr;
                    </button>
                </form>

                <div style="text-align: center; margin-top: 20px; font-size: 0.92rem; color: var(--text-secondary);">
                    Don't have an account yet? <a href="register.html" style="font-weight: 700;">Create one here</a>
                </div>

                <!-- Demo Accounts Quick Fill -->
                <div class="demo-accounts">
                    <h3 style="display: flex; align-items: center; justify-content: center; gap: 6px;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        Quick Demo Sign-In
                    </h3>
                    <div class="demo-buttons">
                        <button type="button" class="btn btn-outline btn-small" onclick="fillDemo('user')" style="display: inline-flex; align-items: center; gap: 6px;">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            Student Demo
                        </button>
                        <button type="button" class="btn btn-outline btn-small" onclick="fillDemo('admin')" style="display: inline-flex; align-items: center; gap: 6px;">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                            Admin Demo
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Smart Canteen. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        function togglePasswordVisibility(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                field.type = 'password';
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }

        function fillDemo(role) {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            if (role === 'admin') {
                usernameInput.value = 'admin';
                passwordInput.value = 'admin123';
            } else {
                usernameInput.value = 'user';
                passwordInput.value = 'user123';
            }
            showMessage(`Filled ${role} demo credentials. Click 'Sign In' to proceed.`, 'info');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('usernameError').textContent = '';
            document.getElementById('passwordError').textContent = '';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            let hasError = false;
            if (!username) {
                document.getElementById('usernameError').textContent = 'Please enter your username';
                hasError = true;
            }
            if (!password) {
                document.getElementById('passwordError').textContent = 'Please enter your password';
                hasError = true;
            }
            if (hasError) return;

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Signing in...';
            submitBtn.disabled = true;

            try {
                const result = await loginUser(username, password);
                if (result.success) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        if (result.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'user_dashboard.html';
                        }
                    }, 800);
                } else {
                    showMessage(result.message || 'Invalid username or password', 'error');
                    submitBtn.textContent = 'Sign In →';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showMessage('Network or server error. Please try again.', 'error');
                submitBtn.textContent = 'Sign In →';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
