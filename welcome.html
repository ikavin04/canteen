<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Smart Canteen | KGiSL</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .splash-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FFF5F2 0%, #FFF9EB 50%, #F0FDF4 100%);
            padding: 24px;
            text-align: center;
            position: relative;
        }

        .splash-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 94, 54, 0.18);
            border-radius: 28px;
            padding: 50px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .splash-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #FF5E36 0%, #FF8C42 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(255, 94, 54, 0.35);
            animation: bounceIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .splash-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1E293B;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .splash-subtitle {
            font-size: 1rem;
            color: #64748B;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .splash-loader {
            width: 100%;
            height: 6px;
            background: #E2E8F0;
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: 24px;
            position: relative;
        }

        .splash-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF5E36, #FF8C42, #10B981);
            border-radius: var(--radius-full);
            animation: progressFill 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .splash-skip-btn {
            font-size: 0.9rem;
            font-weight: 700;
            color: #FF5E36;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            transition: all 0.2s ease;
        }

        .splash-skip-btn:hover {
            background: rgba(255, 94, 54, 0.1);
        }

        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="splash-wrapper">
        <div class="splash-card">
            <div class="splash-icon">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="white">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 2.18l7 3.82v8c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V8l7-3.82z"/>
                    <path d="M8 10h3v8H8zm5 0h3v8h-3z" fill="white"/>
                </svg>
            </div>
            <h1 class="splash-title">Smart Canteen</h1>
            <p class="splash-subtitle">KGiSL Institute of Technology</p>

            <div class="splash-loader">
                <div class="splash-progress"></div>
            </div>

            <button onclick="redirectNow()" class="splash-skip-btn">
                Skip to Menu &rarr;
            </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function redirectNow() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                if (currentUser.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'user_dashboard.html';
                }
            } else {
                window.location.href = 'index.html';
            }
        }

        // Auto-redirect after animation completes (3.2 seconds)
        setTimeout(redirectNow, 3200);
    </script>
</body>
</html>
