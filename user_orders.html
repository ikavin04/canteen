<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders & Live Tracking - Smart Canteen</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .orders-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .orders-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .order-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
        }

        .order-card:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(255, 94, 54, 0.25);
        }

        .order-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-card-token {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-card-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .order-card-items {
            margin: 18px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .order-card-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .order-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="user_dashboard.html" class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 2.18l7 3.82v8c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V8l7-3.82z"/>
                    <path d="M8 10h3v8H8zm5 0h3v8h-3z" fill="#FF5E36"/>
                </svg>
                <span>Smart<br>Canteen</span>
            </a>
            <div class="nav-menu">
                <button class="hamburger" id="hamburgerBtn" aria-controls="navLinks" aria-expanded="false" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="nav-links" id="navLinks">
                    <!-- Drawer Header (Mobile only) -->
                    <div class="drawer-header">
                        <div class="drawer-brand">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 2.18l7 3.82v8c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V8l7-3.82z"/>
                                <path d="M8 10h3v8H8zm5 0h3v8h-3z" fill="#FF5E36"/>
                            </svg>
                            <span>Smart Canteen</span>
                        </div>
                        <button class="drawer-close-btn" aria-label="Close menu">&times;</button>
                    </div>

                    <!-- Drawer User Card (Mobile only) -->
                    <div class="drawer-user-card">
                        <div class="drawer-user-avatar" id="drawerUserAvatar">U</div>
                        <div class="drawer-user-details">
                            <div class="drawer-user-name" id="drawerUserName">User</div>
                            <div class="drawer-user-role" id="drawerUserRole">Student</div>
                        </div>
                    </div>

                    <a href="user_dashboard.html">
                        <div class="nav-link-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
                            <span>Daily Menu</span>
                        </div>
                        <span class="nav-link-arrow">&rarr;</span>
                    </a>

                    <a href="user_orders.html" class="active">
                        <div class="nav-link-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                            <span>My Orders</span>
                        </div>
                        <span class="nav-link-arrow">&rarr;</span>
                    </a>

                    <!-- Desktop User Info -->
                    <div class="user-info">
                        <span id="userName">User</span>
                        <button onclick="logout()" class="btn btn-outline btn-small">Logout</button>
                    </div>

                    <!-- Drawer Footer (Mobile only) -->
                    <div class="drawer-footer">
                        <button onclick="logout()" class="btn-logout">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                            <span>Sign Out</span>
                        </button>
                        <div class="drawer-footer-text">Smart Canteen</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="nav-backdrop" id="navBackdrop"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="orders-container">
            <div id="notification" class="notification hidden"></div>

            <div class="orders-header">
                <div>
                    <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--secondary); letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px;">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <span>Order History & Live Tracking</span>
                    </h1>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">
                        Real-time kitchen status updates every 10 seconds.
                    </p>
                </div>

                <!-- Filter Tabs -->
                <div style="display: flex; gap: 8px; background: var(--bg-surface); padding: 4px; border-radius: var(--radius-full); border: 1px solid var(--border-color);">
                    <button class="btn btn-small btn-primary" id="filterAll" onclick="setOrderFilter('all')">All Orders</button>
                    <button class="btn btn-small btn-outline" id="filterActive" onclick="setOrderFilter('active')">Active In Kitchen</button>
                    <button class="btn btn-small btn-outline" id="filterCompleted" onclick="setOrderFilter('completed')">Completed</button>
                </div>
            </div>

            <!-- Orders Feed List -->
            <div id="ordersList">
                <div style="text-align: center; padding: 60px 20px;">
                    <div style="width: 48px; height: 48px; margin: 0 auto 12px; color: var(--primary);">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1.2s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                    </div>
                    <p style="color: var(--text-muted);">Fetching your orders from the kitchen...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Smart Canteen. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        let currentFilter = 'all';
        let previousOrders = [];

        const currentUser = getCurrentUser();
        if (!currentUser) {
            window.location.href = 'login.html';
        } else if (currentUser.role === 'admin') {
            window.location.href = 'admin.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.username;
            }
            initializeMobileNav();
            fetchAndRenderOrders();
            // Real-time polling every 10 seconds
            setInterval(fetchAndRenderOrders, 10000);
        });

        function setOrderFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.orders-header .btn').forEach(b => {
                b.classList.remove('btn-primary');
                b.classList.add('btn-outline');
            });
            if (filter === 'all') {
                document.getElementById('filterAll').classList.replace('btn-outline', 'btn-primary');
            } else if (filter === 'active') {
                document.getElementById('filterActive').classList.replace('btn-outline', 'btn-primary');
            } else {
                document.getElementById('filterCompleted').classList.replace('btn-outline', 'btn-primary');
            }
            renderOrders(previousOrders);
        }

        async function fetchAndRenderOrders() {
            try {
                const orders = await getUserOrders();
                
                // Check if any order newly became 'Ready'
                if (previousOrders.length > 0) {
                    orders.forEach(order => {
                        const prev = previousOrders.find(p => p.order_id === order.order_id);
                        if (prev && prev.status !== 'Ready' && order.status === 'Ready') {
                            showMessage(`Order ${order.order_id} is READY for pickup at the counter!`, 'success');
                        }
                    });
                }

                previousOrders = orders;
                renderOrders(orders);
            } catch (err) {
                console.error('Error fetching orders:', err);
            }
        }

        function renderOrders(orders) {
            const listEl = document.getElementById('ordersList');
            let filtered = orders;

            if (currentFilter === 'active') {
                filtered = orders.filter(o => o.status !== 'Completed');
            } else if (currentFilter === 'completed') {
                filtered = orders.filter(o => o.status === 'Completed');
            }

            if (!filtered || filtered.length === 0) {
                listEl.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
                        <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: #FFF5F2; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
                        </div>
                        <h3 style="color: var(--secondary); margin-bottom: 6px;">No Orders Found</h3>
                        <p style="color: var(--text-muted); margin-bottom: 20px;">You haven't placed any orders in this category yet.</p>
                        <a href="user_dashboard.html" class="btn btn-primary">Browse Today's Menu</a>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = filtered.map(order => {
                const items = typeof order.items === 'string' ? JSON.parse(order.items) : (order.items || []);
                const status = order.status || 'Uncompleted';
                
                // Timeline Step States
                const isPlaced = true;
                const isPreparing = status === 'Uncompleted' || status === 'Preparing' || status === 'Ready' || status === 'Completed';
                const isReady = status === 'Ready' || status === 'Completed';
                const isCompleted = status === 'Completed';

                let statusBadgeClass = 'status-preparing';
                let statusLabel = 'In Kitchen';
                if (status === 'Ready') {
                    statusBadgeClass = 'status-ready';
                    statusLabel = 'Ready for Pickup!';
                } else if (status === 'Completed') {
                    statusBadgeClass = 'status-completed';
                    statusLabel = 'Collected';
                }

                return `
                    <div class="order-card">
                        <div class="order-card-header">
                            <div class="order-card-token">
                                <span style="display: inline-flex; align-items: center; gap: 6px;">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                                    ${order.order_id}
                                </span>
                                <span class="status-badge ${statusBadgeClass}">${statusLabel}</span>
                            </div>
                            <span class="order-card-date">${new Date(order.created_at || Date.now()).toLocaleString()}</span>
                        </div>

                        <!-- Live Timeline Visualizer -->
                        <div class="orders-timeline">
                            <div class="timeline-step ${isPlaced ? 'completed' : ''}">
                                <div class="step-node">${isPlaced ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '1'}</div>
                                <span class="step-label">Placed</span>
                            </div>
                            <div class="timeline-step ${isPreparing ? (status === 'Ready' || status === 'Completed' ? 'completed' : 'current') : ''}">
                                <div class="step-node">${isReady ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '2'}</div>
                                <span class="step-label">Preparing</span>
                            </div>
                            <div class="timeline-step ${isReady ? (status === 'Completed' ? 'completed' : 'current') : ''}">
                                <div class="step-node">${isCompleted ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '3'}</div>
                                <span class="step-label">Ready for Pickup</span>
                            </div>
                            <div class="timeline-step ${isCompleted ? 'completed' : ''}">
                                <div class="step-node">${isCompleted ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '4'}</div>
                                <span class="step-label">Collected</span>
                            </div>
                        </div>

                        <!-- Itemized Summary -->
                        <div class="order-card-items">
                            ${items.map(i => `
                                <div class="order-card-item-row">
                                    <span style="font-weight: 600;">${i.name} &times; ${i.quantity}</span>
                                    <span style="color: var(--text-secondary);">₹${(parseFloat(i.price) * i.quantity).toFixed(2)}</span>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Footer Info & Actions -->
                        <div class="order-card-footer">
                            <div style="font-size: 0.9rem; color: var(--text-muted);">
                                Payment: <strong style="color: var(--secondary);">${order.payment_method || 'Razorpay'}</strong> 
                                (${order.payment_status || 'Paid'})
                            </div>
                            <div style="display: flex; align-items: center; gap: 16px;">
                                <div style="font-size: 1.3rem; font-weight: 800; color: var(--primary);">
                                    ₹${parseFloat(order.total_amount).toFixed(2)}
                                </div>
                                <a href="order_confirmation.html?orderId=${order.order_id}" class="btn btn-outline btn-small">
                                    View Digital Token &rarr;
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
