<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Dish Not Found | Smart Canteen</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 107, 53, 0.15);
            border-radius: 28px;
            padding: 50px 40px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-out;
        }

        .error-illustration {
            width: 160px;
            height: 160px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.12), rgba(253, 191, 80, 0.18));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .error-badge {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FF5E36 0%, #FF8C42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 1.05rem;
            color: #64748B;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo" style="text-decoration: none;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 2.18l7 3.82v8c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V8l7-3.82z"/>
                    <path d="M8 10h3v8H8zm5 0h3v8h-3z" fill="#FF5E36"/>
                </svg>
                <span>Smart<br>Canteen</span>
            </a>
            <div class="nav-menu">
                <a href="index.html" class="btn btn-outline btn-small">Home</a>
                <a href="user_dashboard.html" class="btn btn-primary btn-small">Menu</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="error-page-container">
            <div class="error-card">
                <div class="error-illustration">
                    <!-- Cafeteria Cloche / Bowl SVG -->
                    <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="#FF5E36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                </div>
                <div class="error-badge">404</div>
                <h1 class="error-title">Dish Not Found!</h1>
                <p class="error-desc">
                    Looks like you took a wrong turn in the cafeteria! The page or menu item you are looking for has been moved, eaten, or never existed.
                </p>
                <div class="error-actions">
                    <a href="user_dashboard.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
                        Browse Today's Menu
                    </a>
                    <a href="index.html" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 8px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        Back to Home
                    </a>
                    <a href="user_orders.html" class="btn btn-outline" style="display: inline-flex; align-items: center; gap: 8px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        View Orders
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Smart Canteen. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
